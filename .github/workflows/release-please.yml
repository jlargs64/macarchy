name: Release

# Every push to main updates one open "chore(main): release x.y.z" PR with the
# next version and a CHANGELOG.md entry built from Conventional Commits.
# Merging that PR tags vX.Y.Z and publishes the GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summary
        if: steps.release.outputs.release_created
        run: echo "Released ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
