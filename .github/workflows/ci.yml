name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything in .pre-commit-config.yaml: shellcheck, shfmt, ruff, StyLua,
  # actionlint, zizmor, detect-secrets and the file hygiene checks. A clean
  # `pre-commit run --all-files` locally means this job passes.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # Pushes straight to main cannot be rejected after the fact, so this only
  # warns. release-please ignores commits it cannot parse, which means a
  # non-conventional commit is missing from the changelog.
  commits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional Commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER~1..$AFTER"; else range="$BEFORE..$AFTER"; fi
          re='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"; subject="${line#* }"
            case "$subject" in "Merge "*|"chore(main): release"*) continue ;; esac
            if ! printf '%s' "$subject" | grep -qE "$re"; then
              echo "::warning title=Not a Conventional Commit::$sha $subject (left out of the changelog)"
              bad=1
            fi
          done < <(git log --format='%h %s' "$range")
          [ "$bad" = 0 ] && echo "All commit subjects parse."
          exit 0
