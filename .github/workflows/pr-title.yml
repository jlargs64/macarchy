name: PR title

# PRs are squash-merged, so the title becomes the commit on main and the
# changelog line. Reject titles release-please cannot parse. Plain
# pull_request is enough: the check only reads the title, so it needs no
# write token even on forks.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: 'Start the subject with a lowercase letter, e.g. "fix(ws): refresh the bar after moves".'
